services:
  - type: web
    name: bgh-pusher
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: DimalaxYT/bgh
      - key: GITHUB_BRANCH
        value: main
      - key: NODE_ENV
        value: production
